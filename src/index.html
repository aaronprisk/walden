<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walden</title>
  
  <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
  <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>

  <style>
    :root {
      --bg-color: #faf8f5;
      --sidebar-bg: #f0ede9;
      --text-color: #2e2e2e;
      --accent-color: #4a5d4e;
      --border-color: #d8d3cb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }

    /* Left Sidebar: Browser */
    .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
    .posts-list { flex: 1; overflow-y: auto; list-style: none; padding: 10px; }
    .post-item { padding: 10px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-item:hover { background: rgba(0,0,0,0.05); }
    .sidebar-footer { padding: 15px; border-top: 1px solid var(--border-color); }

    /* Center Stage: Main Editor */
    .main-content { flex: 1; display: flex; flex-direction: column; padding: 40px; overflow-y: auto; }
    .editor-header { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; }
    input[type="text"] { flex: 1; padding: 10px 0; font-size: 1.8rem; border: none; background: transparent; border-bottom: 1px solid var(--border-color); outline: none; font-weight: 600; color: var(--text-color); }
    .action-btn { background: var(--accent-color); color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-size: 0.95rem; font-weight: 500; }
    .action-btn.secondary { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
    .action-btn:hover { opacity: 0.9; }

    /* High-Contrast EasyMDE Fixes */
    .EasyMDEContainer .editor-toolbar { background: #e8e4de !important; border-color: var(--border-color) !important; opacity: 1 !important; border-top-left-radius: 4px; border-top-right-radius: 4px; }
    .EasyMDEContainer .editor-toolbar button { color: #2e2e2e !important; }
    .EasyMDEContainer .editor-toolbar button.active, .EasyMDEContainer .editor-toolbar button:hover { background: #dcd7ce !important; border-color: #999 !important; }
    .CodeMirror { border-color: var(--border-color) !important; background: white !important; font-size: 1rem; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; color: var(--text-color); }

    /* Right Overlay: Settings Panel */
    .settings-panel { position: fixed; right: -350px; top: 0; width: 350px; height: 100%; background: white; box-shadow: -5px 0 25px rgba(0,0,0,0.1); border-left: 1px solid var(--border-color); transition: right 0.3s ease; padding: 30px; display: flex; flex-direction: column; gap: 20px; z-index: 1000; }
    .settings-panel.open { right: 0; }
    .settings-panel h3 { font-size: 1.3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.85rem; font-weight: bold; color: #666; }
    .form-group input { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; outline: none; }
    
    /* Style the native EasyMDE preview canvas */
    .EasyMDEContainer .editor-preview-active {
      background: white !important;
      color: var(--text-color) !important;
      line-height: 1.6;
      padding: 30px;
    }

    /* Ensure headings inside the preview look distinct and crisp */
    .editor-preview-active h1, 
    .editor-preview-active h2, 
    .editor-preview-active h3 {
      margin-top: 20px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
    }

    .editor-preview-active p {
      margin-bottom: 15px;
    }
    
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <div class="sidebar-header">
        <span>🏡 Walden</span>
        <button id="new-btn" class="action-btn" style="padding: 4px 10px; font-size: 0.8rem;">+ New</button>
        <button id="sync-btn" class="action-btn secondary" style="padding: 4px 8px; font-size: 0.8rem;" title="Pull latest changes from GitHub">Sync</button>
      </div>
      <ul class="posts-list" id="posts-list">
        <li class="post-item" style="color: #888; font-style: italic; text-align: center; margin-top: 20px;">No folder selected</li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <button id="toggle-settings-btn" class="action-btn secondary" style="width: 100%;">⚙️ Settings</button>
    </div>
  </div>

  <div class="main-content">
    <div class="editor-header">
      <input type="text" id="post-title" placeholder="Title your thoughts...">
      <button id="save-local-btn" class="action-btn secondary">Save Draft</button>
      <button id="publish-btn" class="action-btn">Publish to Web</button>
    </div>
    <textarea id="markdown-editor"></textarea>

    <div class="metadata-panel" style="background: #f8f9fa; border: 1px solid var(--border-color, #ccc); border-radius: 8px; padding: 1.5rem; margin-top: 15px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); flex-shrink: 0;">
      <h4 style="margin-top: 0; margin-bottom: 1rem; font-size: 1rem; font-weight: 600; color: #333;">📖 Post Metadata (Jekyll / SEO)</h4>
      
      <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <div style="flex: 2; min-width: 280px;">
          <label for="post-desc" style="display: block; font-size: 0.8rem; font-weight: bold; color: #555; margin-bottom: 5px;">Summary / Description</label>
          <input type="text" id="post-desc" placeholder="Write a brief 1-2 sentence preview summary for socials and homepage cards..." 
                 style="width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; outline: none; box-sizing: border-box; background: white;">
        </div>
        
        <div style="flex: 1; min-width: 180px;">
          <label for="post-tags" style="display: block; font-size: 0.8rem; font-weight: bold; color: #555; margin-bottom: 5px;">Tags (Comma Separated)</label>
          <input type="text" id="post-tags" placeholder="e.g. Linux, Ubuntu, Bash" 
                 style="width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; outline: none; box-sizing: border-box; background: white;">
        </div>
      </div>
    </div>
  </div>

  <div class="settings-panel" id="settings-panel">
    <h3>Cabin Settings</h3>
    
    <div class="form-group">
      <label for="cfg-engine">Blog Engine</label>
      <select id="cfg-engine" style="padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background: white; outline: none;">
        <option value="vanilla">Vanilla JS (Targets /blog)</option>
        <option value="jekyll">Jekyll Pages (Targets /_posts)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="cfg-username">GitHub Username</label>
      <input type="text" id="cfg-username" placeholder="e.g., thoreau1854">
    </div>
    <div class="form-group">
      <label for="cfg-repo">Repository Name</label>
      <input type="text" id="cfg-repo" placeholder="e.g., personal-blog">
    </div>
    <div class="form-group">
      <label for="cfg-token">Personal Access Token (PAT)</label>
      <input type="password" id="cfg-token" placeholder="ghp_xxxxxxxxxxxx">
    </div>
    
    <button id="save-settings-btn" class="action-btn" style="width: 100%; margin-top: 10px;">Save Configuration</button>
    <button id="close-settings-btn" class="action-btn secondary" style="width: 100%;">Close</button>
  </div>

  <script src="./main.js"></script>
</body>
</html>
